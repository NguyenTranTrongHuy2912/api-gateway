syntax = "proto3";

package chat;

option java_package = "iuh.fit.grpc.chat";
option java_multiple_files = true;

service ChatService {
  rpc SendMessage (ChatMessage) returns (ChatResponse);
  rpc GetMessageHistory (HistoryRequest) returns (HistoryResponse);

  // --- Phòng chat ---
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse);
  rpc CreateRoom (CreateRoomRequest) returns (Room);
  rpc ListRooms (ListRoomsRequest) returns (ListRoomsResponse);
  rpc MarkRoomRead (MarkRoomReadRequest) returns (MarkRoomReadResponse);

  // --- Quản lý nhóm (Java là nơi duy nhất ghi dữ liệu phòng) ---
  rpc LeaveRoom (LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc AddRoomMembers (AddRoomMembersRequest) returns (AddRoomMembersResponse);
  rpc UpdateRoomName (UpdateRoomNameRequest) returns (UpdateRoomNameResponse);

  // --- Realtime Streaming ---
  rpc SubscribeEvents (StreamEventsRequest) returns (stream ChatEvent);

  // --- Hệ thống kết bạn ---
  rpc SendFriendRequest (SendFriendRequestReq) returns (SendFriendRequestResp);
  rpc RespondFriendRequest (RespondFriendRequestReq) returns (RespondFriendRequestResp);
  rpc ListFriends (ListFriendsReq) returns (ListFriendsResp);
  rpc ListFriendRequests (ListFriendRequestsReq) returns (ListFriendRequestsResp);

  // --- Hành động trên tin nhắn (Java là nơi duy nhất ghi dữ liệu) ---
  rpc RevokeMessage (RevokeMessageRequest) returns (RevokeMessageResponse);
  rpc EditMessage (EditMessageRequest) returns (EditMessageResponse);
  rpc ReactMessage (ReactMessageRequest) returns (ReactMessageResponse);
  rpc CreatePoll (CreatePollRequest) returns (PollResponse);
  rpc VotePoll (VotePollRequest) returns (PollResponse);
  rpc PinMessage (PinMessageRequest) returns (PinMessageResponse);
  rpc UnpinMessage (UnpinMessageRequest) returns (UnpinMessageResponse);
  rpc ToggleStarMessage (ToggleStarMessageRequest) returns (ToggleStarMessageResponse);
}

enum MessageType {
  MESSAGE_TYPE_TEXT = 0;    // mặc định: tin cũ không có trường này vẫn là text
  MESSAGE_TYPE_IMAGE = 1;
  MESSAGE_TYPE_VIDEO = 2;   // dành sẵn, chưa hỗ trợ
}

message ChatMessage {
  string message_id = 1;
  string room_id = 2;
  string sender_id = 3;
  string content = 4;        // TEXT: nội dung; IMAGE: để trống
  int64 timestamp = 5;
  MessageType type = 6;
  string media_url = 7;      // IMAGE/VIDEO: URL https của file đã upload
  int32 media_width = 8;
  int32 media_height = 9;
  int64 media_duration_ms = 10;  // dành cho VIDEO
  string reply_to = 11;
  string file_name = 12;
  int64 file_size = 13;
  string poll_id = 14;
  bool is_forwarded = 15;
  bool is_edited = 16;
  int64 edited_at = 17;
}

message ChatResponse {
  string message_id = 1;
  bool is_success = 2;
  string status_message = 3;
  int64 timestamp = 4;
}

message HistoryRequest {
  string room_id = 1;
  int32 limit = 2;             // mặc định 50, tối đa 100
  int64 before_timestamp = 3;  // 0 = lấy tin mới nhất
  string user_id = 4;          // người đang xem; bắt buộc, phải là thành viên phòng
}

message HistoryResponse {
  repeated ChatMessage messages = 1;  // mới nhất trước
  bool has_more = 2;
}

// ---------------------------------------------------------------- Phòng chat

enum RoomType {
  ROOM_TYPE_UNSPECIFIED = 0;
  ROOM_TYPE_DIRECT = 1;   // chat 1-1
  ROOM_TYPE_GROUP = 2;    // chat nhóm
}

message RoomMember {
  string user_id = 1;
  string display_name = 2;
}

message Room {
  string room_id = 1;
  RoomType type = 2;
  string name = 3;                    // DIRECT: tên người còn lại; GROUP: tên nhóm
  repeated string member_ids = 4;
  string last_message_content = 5;    // rỗng nếu chưa có tin
  string last_message_sender_id = 6;
  int64 last_message_timestamp = 7;   // 0 = chưa có tin
  int64 unread_count = 8;             // tính theo người đang xem
  repeated RoomMember members = 9;    // để client hiện tên người gửi thay vì id
}

message UserSummary {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  string avatar_url = 4;
}

message SearchUsersRequest {
  string requester_id = 1;   // loại chính người này khỏi kết quả
  string query = 2;          // chứa '@' => tìm theo email (tiền tố); ngược lại tìm theo tên
  int32 limit = 3;           // mặc định 10, tối đa 20
}

message SearchUsersResponse {
  repeated UserSummary users = 1;
}

message CreateRoomRequest {
  string creator_id = 1;
  RoomType type = 2;
  string name = 3;                   // chỉ dùng cho GROUP
  repeated string member_ids = 4;    // không cần gồm creator_id
}

message ListRoomsRequest {
  string user_id = 1;
}

message ListRoomsResponse {
  repeated Room rooms = 1;           // hoạt động gần nhất trước
}

message MarkRoomReadRequest {
  string user_id = 1;
  string room_id = 2;
  int64 read_up_to_timestamp = 3;    // 0 = đã đọc đến tin mới nhất hiện có
}

message MarkRoomReadResponse {}

// ---------------------------------------------------------------- Quản lý nhóm

message LeaveRoomRequest {
  string user_id = 1;      // người rời (lấy từ token ở gateway)
  string room_id = 2;
}

message LeaveRoomResponse {
  bool is_success = 1;
  string status_message = 2;
}

message AddRoomMembersRequest {
  string user_id = 1;                // người thực hiện, phải là thành viên nhóm
  string room_id = 2;
  repeated string member_ids = 3;    // người cần thêm; ai đã trong nhóm thì bỏ qua
}

message AddRoomMembersResponse {
  Room room = 1;                     // trạng thái phòng sau khi thêm, tính theo người thực hiện
  int32 added_count = 2;             // số người thực sự được thêm mới
}

message UpdateRoomNameRequest {
  string user_id = 1;                // người thực hiện, phải là thành viên nhóm
  string room_id = 2;
  string name = 3;
}

message UpdateRoomNameResponse {
  Room room = 1;
}

// ---------------------------------------------------------------- Realtime Streaming

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_NEW_MESSAGE = 1;
  EVENT_ROOM_UPDATED = 2;
  EVENT_READ_RECEIPT = 3;
  EVENT_FRIEND_REQUEST = 4;
  EVENT_FRIEND_ACCEPTED = 5;
  EVENT_MESSAGE_REVOKED = 6;
  EVENT_MESSAGE_EDITED = 7;
  EVENT_MESSAGE_REACTION = 8;
  EVENT_POLL_CREATED = 9;
  EVENT_POLL_UPDATED = 10;
  EVENT_ROOM_PINNED = 11;
}

message StreamEventsRequest {
  string user_id = 1;
}

message ChatEvent {
  EventType event_type = 1;
  ChatMessage message = 2;
  Room room = 3;
  string user_id = 4;
  int64 timestamp = 5;
  FriendRequestItem friend_request = 6;
  MessageUpdate message_update = 7;   // REVOKED / EDITED / REACTION
  Poll poll = 8;                      // POLL_CREATED / POLL_UPDATED
  PinUpdate pin_update = 9;           // ROOM_PINNED
}

// ---------------------------------------------------------------- Hệ thống kết bạn

enum FriendRequestStatus {
  FRIEND_REQUEST_PENDING = 0;
  FRIEND_REQUEST_ACCEPTED = 1;
  FRIEND_REQUEST_REJECTED = 2;
}

message FriendRequestItem {
  string request_id = 1;
  string sender_id = 2;
  string sender_name = 3;
  string sender_email = 4;
  string receiver_id = 5;
  int64 created_at = 6;
  FriendRequestStatus status = 7;
}

message SendFriendRequestReq {
  string sender_id = 1;
  string receiver_id = 2;
}

message SendFriendRequestResp {
  bool is_success = 1;
  string status_message = 2;
  FriendRequestItem request = 3;
}

message RespondFriendRequestReq {
  string user_id = 1;
  string request_id = 2;
  bool accept = 3;
}

message RespondFriendRequestResp {
  bool is_success = 1;
  string status_message = 2;
}

message ListFriendsReq {
  string user_id = 1;
}

message ListFriendsResp {
  repeated UserSummary friends = 1;
}

message ListFriendRequestsReq {
  string user_id = 1;
}

message ListFriendRequestsResp {
  repeated FriendRequestItem requests = 1;
}

// ---------------------------------------------------------------- Hành động trên tin nhắn

message ReactionEntry {
  string emoji = 1;
  repeated string user_ids = 2;
}

// Payload chung cho event REVOKED / EDITED / REACTION.
message MessageUpdate {
  string room_id = 1;
  string message_id = 2;
  string sender_id = 3;              // REVOKED: người gửi tin
  string content = 4;                // REVOKED / EDITED: nội dung mới
  bool is_edited = 5;
  int64 edited_at = 6;
  int64 timestamp = 7;               // REVOKED: thời điểm thu hồi
  repeated ReactionEntry reactions = 8;  // REACTION: trạng thái đầy đủ sau khi đổi
  string user_id = 9;                // REACTION: người vừa thả/gỡ
  string emoji = 10;                 // REACTION: emoji vừa thao tác
}

message RevokeMessageRequest {
  string user_id = 1;                // lấy từ token ở gateway
  string room_id = 2;
  string message_id = 3;
}

message RevokeMessageResponse {
  string message_id = 1;
  string content = 2;
  bool already_revoked = 3;
}

message EditMessageRequest {
  string user_id = 1;
  string room_id = 2;
  string message_id = 3;
  string content = 4;
}

message EditMessageResponse {
  string message_id = 1;
  string content = 2;
  int64 edited_at = 3;
}

message ReactMessageRequest {
  string user_id = 1;
  string room_id = 2;
  string message_id = 3;
  string emoji = 4;                  // gửi lại cùng emoji = gỡ cảm xúc
}

message ReactMessageResponse {
  string message_id = 1;
  repeated ReactionEntry reactions = 2;
}

message PollOption {
  string option_id = 1;
  string text = 2;
  repeated string voter_ids = 3;
}

message Poll {
  string poll_id = 1;
  string room_id = 2;
  string message_id = 3;
  string creator_id = 4;
  string creator_name = 5;
  string question = 6;
  repeated PollOption options = 7;
  bool is_multiple_choice = 8;
  bool is_anonymous = 9;
  bool is_closed = 10;
  int64 created_at = 11;
}

message CreatePollRequest {
  string user_id = 1;
  string room_id = 2;
  string question = 3;
  repeated string options = 4;
  bool is_multiple_choice = 5;
  bool is_anonymous = 6;
}

message VotePollRequest {
  string user_id = 1;
  string poll_id = 2;
  string option_id = 3;              // bấm lại lựa chọn đã chọn = bỏ phiếu
}

message PollResponse {
  Poll poll = 1;
}

message PinnedMessage {
  string message_id = 1;
  string content = 2;
  string sender_id = 3;
  string sender_name = 4;
  int64 timestamp = 5;
  string pinned_by = 6;
  int64 pinned_at = 7;
}

// pinned_message không set = phòng không còn tin ghim.
message PinUpdate {
  string room_id = 1;
  PinnedMessage pinned_message = 2;
}

message PinMessageRequest {
  string user_id = 1;
  string room_id = 2;
  string message_id = 3;
}

message PinMessageResponse {
  PinnedMessage pinned_message = 1;
}

message UnpinMessageRequest {
  string user_id = 1;
  string room_id = 2;
}

message UnpinMessageResponse {}

message ToggleStarMessageRequest {
  string user_id = 1;
  string message_id = 2;
}

message ToggleStarMessageResponse {
  string message_id = 1;
  bool starred = 2;
}

// ---------------------------------------------------------------------- Auth & Profile

service AuthService {
  rpc RequestOtp (RequestOtpRequest) returns (RequestOtpResponse);
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);

  // --- Tab Cá nhân ---
  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc ChangePasswordLoggedIn (ChangePasswordLoggedInRequest) returns (ChangePasswordLoggedInResponse);

  // --- Quản trị & Đồng bộ trạng thái (Java chịu trách nhiệm chính) ---
  rpc GetUserStatus (GetUserStatusRequest) returns (GetUserStatusResponse);
  rpc SetUserRole (SetUserRoleRequest) returns (SetUserRoleResponse);
  rpc GetSystemStats (GetSystemStatsRequest) returns (GetSystemStatsResponse);
  rpc SetUserActive (SetUserActiveRequest) returns (SetUserActiveResponse);
  rpc DeleteUser (DeleteUserRequest) returns (DeleteUserResponse);
}

enum OtpPurpose {
  OTP_PURPOSE_REGISTER = 0;         // mặc định: giữ nguyên hành vi đăng ký cũ
  OTP_PURPOSE_RESET_PASSWORD = 1;
}

message RequestOtpRequest {
  string account = 1;          // email
  OtpPurpose purpose = 2;
}

message RequestOtpResponse {
  int32 expires_in_seconds = 1;
  int32 resend_after_seconds = 2;
}

message RegisterRequest {
  string account = 1;          // email
  string password = 2;
  string display_name = 3;
  string otp_code = 4;
}

message LoginRequest {
  string account = 1;          // email
  string password = 2;
}

message AuthResponse {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
  string role = 4;
}

message ResetPasswordRequest {
  string account = 1;          // email
  string otp_code = 2;
  string new_password = 3;
}

message ResetPasswordResponse {}

message UpdateProfileRequest {
  string user_id = 1;
  string display_name = 2;
  string avatar_url = 3;
}

message UpdateProfileResponse {
  bool is_success = 1;
  string status_message = 2;
  string display_name = 3;
  string avatar_url = 4;
}

message ChangePasswordLoggedInRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordLoggedInResponse {
  bool is_success = 1;
  string status_message = 2;
}

message GetUserStatusRequest {
  string user_id = 1;
}

message GetUserStatusResponse {
  string user_id = 1;
  string role = 2;
  bool is_active = 3;
  int64 password_changed_at = 4;
}

message SetUserRoleRequest {
  string user_id = 1;
  string role = 2;
}

message SetUserRoleResponse {
  bool is_success = 1;
  string user_id = 2;
  string role = 3;
}

message GetSystemStatsRequest {}

message GetSystemStatsResponse {
  int64 total_users = 1;
  int64 total_admins = 2;
  int64 total_active_users = 3;
  int64 total_rooms = 4;
  int64 total_messages = 5;
}

message SetUserActiveRequest {
  string user_id = 1;
  bool is_active = 2;
}

message SetUserActiveResponse {
  bool is_success = 1;
  string user_id = 2;
  bool is_active = 3;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool is_success = 1;
  string user_id = 2;
}
